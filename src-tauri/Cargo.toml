[package]
name = "docx-break-cleaner"
version = "0.1.0"
description = "Offline review and repair of hidden DOCX paragraph breaks"
authors = ["Gnosis TMS"]
edition = "2021"
publish = false

[lib]
name = "docx_break_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.0.6", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
quick-xml = "=0.41.0"
xmltree = "0.11"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
