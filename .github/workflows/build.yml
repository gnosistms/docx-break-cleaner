name: Release desktop apps

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "DOCX Break Cleaner ${{ github.ref_name }}" \
            --notes "Windows x64 and Apple silicon macOS release of DOCX Break Cleaner.

          - Windows x64 installer (.exe, preferred) and .msi
          - macOS Apple silicon .dmg
          - Offline DOCX scanning and repair; the original document is never overwritten
          - Installed copies from v0.2.0 on update themselves from the app"

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One platform at a time, so each adds itself to latest.json without a race.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Test DOCX engine
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build frontend
        run: npm run build
      - name: Verify Windows app uses the GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --target x86_64-pc-windows-msvc
          $exe = "src-tauri/target/x86_64-pc-windows-msvc/release/docx-break-cleaner.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $optionalHeaderOffset = $peOffset + 24
          $subsystem = [BitConverter]::ToUInt16($bytes, $optionalHeaderOffset + 68)
          if ($subsystem -ne 2) {
            throw "Expected Windows GUI subsystem (2), found $subsystem"
          }
      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DOCX Break Cleaner ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
