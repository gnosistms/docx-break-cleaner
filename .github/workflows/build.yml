name: Release desktop apps

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "DOCX Break Cleaner ${{ github.ref_name }}" \
            --notes "Windows x64 and Apple silicon macOS release of DOCX Break Cleaner.

          - Windows x64 installer (.exe, preferred) and .msi
          - macOS Apple silicon .dmg, signed and notarized by Apple
          - Offline DOCX scanning and repair; the original document is never overwritten
          - Installed copies from v0.2.0 on update themselves from the app"

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One platform at a time, so each adds itself to latest.json without a race.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Test DOCX engine
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build frontend
        run: npm run build
      - name: Verify Windows app uses the GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --target x86_64-pc-windows-msvc
          $exe = "src-tauri/target/x86_64-pc-windows-msvc/release/docx-break-cleaner.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $optionalHeaderOffset = $peOffset + 24
          $subsystem = [BitConverter]::ToUInt16($bytes, $optionalHeaderOffset + 68)
          if ($subsystem -ne 2) {
            throw "Expected Windows GUI subsystem (2), found $subsystem"
          }
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/apple-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "No Developer ID Application identity in the imported certificate." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Write App Store Connect API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS only: Tauri signs the app with this identity, then notarizes and staples it.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DOCX Break Cleaner ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
      - name: Verify the macOS app passes Gatekeeper
        if: runner.os == 'macOS'
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/DOCX Break Cleaner.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
      - name: Sign, notarize and replace the macOS disk image
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          DMG=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -type f | head -n 1)
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" --timestamp "$DMG"
          xcrun notarytool submit "$DMG" --wait --issuer "$APPLE_API_ISSUER" --key-id "$APPLE_API_KEY" --key "$APPLE_API_KEY_PATH"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          # GitHub stores spaces in asset names as dots; upload under the stored name.
          ASSET=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name | select(endswith(".dmg"))' | head -n 1)
          cp "$DMG" "$RUNNER_TEMP/$ASSET"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$ASSET" --clobber
